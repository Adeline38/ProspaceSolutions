<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulter une fiche espace ProSpace Solutions.">
    <title>Fiche espace | ProSpace Solutions</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- Charger les éléments communs du site. -->
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
  </head>
  <body>
    <!-- Injecter le menu commun. -->
    <header class="header"></header>

    <!-- Préparer les emplacements de la fiche dynamique. -->
    <main class="main-fiche-espace">
      <nav class="breadcrumb" aria-label="Fil d’Ariane">
        <div class="breadcrumb__container">
          <ol>
            <li><a href="../index.html">Accueil</a></li>
            <li><span class="dynamic-breadcrumb-city">Ville</span></li>
            <li aria-current="page" class="dynamic-breadcrumb-name">Espace</li>
          </ol>
        </div>
      </nav>

      <!-- Afficher ici l’attente ou une erreur. -->
      <div id="fiche-loading-zone"></div>

      <!-- Masquer la fiche avant le chargement des données. -->
      <div id="fiche-content-zone" hidden>
        <section class="fiche-header">
          <div class="fiche-header__container">
            <h1 class="dynamic-name">Nom de l’espace</h1>
            <p class="dynamic-address">Adresse</p>
            <p><strong class="dynamic-note">0.0</strong> <span class="dynamic-avis">0 avis</span></p>
          </div>
        </section>

        <!-- Préparer la galerie des photographies. -->
        <section class="fiche-gallery" aria-label="Galerie photo de l’espace">
          <div class="gallery-grid">
            <figure class="gallery-item main-img"><img id="gallery-img-1" src="" alt=""></figure>
            <figure class="gallery-item"><img id="gallery-img-2" src="" alt=""></figure>
            <figure class="gallery-item"><img id="gallery-img-3" src="" alt=""></figure>
          </div>
        </section>

        <!-- Regrouper les informations qui seront injectées. -->
        <div class="fiche-body-layout">
          <div class="fiche-info-column">
            <section class="info-block"><h2>À propos</h2><p class="dynamic-description">Description à charger.</p></section>
            <section class="info-block"><h2>Équipements</h2><ul class="dynamic-equipments-list grid-list"></ul></section>
            <section class="info-block"><h2>Capacité</h2><p>Jusqu’à <strong class="dynamic-capacity">0</strong> personnes</p></section>
            <section class="info-block">
              <h2>Tarifs</h2>
              <table class="tarifs-table">
                <caption>Tarifs hors taxes</caption>
                <tbody>
                  <tr><th scope="row">À l’heure</th><td class="price-hour">0 €</td></tr>
                  <tr><th scope="row">Demi-journée</th><td class="price-half">0 €</td></tr>
                  <tr><th scope="row">Journée</th><td class="price-day">0 €</td></tr>
                </tbody>
              </table>
            </section>
          </div>

          <!-- Permettre l’enregistrement de l’espace affiché. -->
          <aside class="fiche-action-sidebar">
            <button type="button" id="btn-toggle-favoris" class="btn-secondary" aria-pressed="false" aria-label="Ajouter cet espace à mes favoris">
              <img src="../assets/icons/ico_coeur.svg" alt="" class="btn-fav-icon icon-svg">
              <span class="btn-fav-text">Ajouter aux favoris</span>
            </button>
          </aside>
        </div>
      </div>
    </main>

    <!-- Injecter le pied de page commun. -->
    <footer class="footer"></footer>
    <!-- Lire l’identifiant après la création du document. -->
    <script src="../assets/js/espace.js" defer></script>
  </body>
</html>
